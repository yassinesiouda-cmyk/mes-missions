<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd6e7">
  <meta name="description" content="Mes tâches et mes points">
  <title>Ganba!</title>
  <meta name="apple-mobile-web-app-title" content="Ganba!">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192-v2.png">
  <link rel="apple-touch-icon" href="icons/icon-192-v2.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="hello" id="hello">Ganba!</div>
    <div class="points" id="pointsBadge" aria-live="polite">
      <span class="star">⭐</span>
      <span class="points-value" id="pointsValue">0</span>
      <span class="points-label">points</span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="jour" role="tab"><span>📋</span>Ma journée</button>
    <button class="tab" data-tab="magasin" role="tab"><span>🎁</span>Boutique</button>
    <button class="tab" data-tab="parent" role="tab"><span>🔒</span>Parent</button>
  </nav>

  <dialog id="modal"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="mascot.js"></script>
  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
